<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="G. STEPHEN — AIML student and aspiring AI and machine learning engineer profile, light theme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="70%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#7C3AED" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".90"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity=".78"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.05  0 0 0 0 0.4  0 0 0 0 0.55  0 0 0 .20 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
    <mask id="reveal">
      <rect x="0" y="0" width="1180" height="610" fill="black"/>
      <rect x="0" y="0" width="0" height="610" fill="white">
        <animate attributeName="width" from="0" to="1180" dur="1.5s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <rect width="1180" height="610" rx="28" fill="#E2E8F0"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="url(#bg)"/>
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="url(#glow)"/>
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="url(#grid)"/>

    <circle cx="1010" cy="82" r="100" fill="#22D3EE" opacity=".06" filter="url(#soft)">
      <animate attributeName="opacity" values=".03;.08;.03" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="500" r="130" fill="#7C3AED" opacity=".045" filter="url(#soft)">
      <animate attributeName="opacity" values=".02;.06;.02" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- terminal chrome -->
    <rect x="18" y="18" width="1144" height="48" fill="#FFFFFF" fill-opacity=".82"/>
    <circle cx="45" cy="42" r="6" fill="#EF4444"/>
    <circle cx="65" cy="42" r="6" fill="#EAB308"/>
    <circle cx="85" cy="42" r="6" fill="#22C55E"/>
    <text x="108" y="47" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">stephen@aiml-profile:~</text>
    <text x="1082" y="47" text-anchor="end" fill="#10B981" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">● ONLINE</text>

    <!-- left visual panel -->
    <rect x="42" y="88" width="420" height="474" rx="18" fill="url(#panel)" stroke="#CBD5E1" stroke-opacity=".65"/>
    <rect x="58" y="105" width="388" height="28" rx="8" fill="#FFFFFF" fill-opacity=".82" stroke="#CBD5E1" stroke-opacity=".35"/>
    <text x="76" y="124" fill="#22D3EE" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2">VISUAL.MAP</text>
    <text x="428" y="124" text-anchor="end" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">01 / 01</text>

    <!-- abstract AI visual -->
    <g transform="translate(82 156)">
      <circle cx="160" cy="118" r="112" fill="none" stroke="#22D3EE" stroke-opacity=".10"/>
      <circle cx="160" cy="118" r="84" fill="none" stroke="#7C3AED" stroke-opacity=".14"/>
      <circle cx="160" cy="118" r="52" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5"/>
      <path d="M160 66V170M108 118H212M123 81L197 155M197 81L123 155" stroke="#22D3EE" stroke-opacity=".22"/>
      <g fill="#22D3EE">
        <circle cx="160" cy="66" r="4"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="108" cy="118" r="4"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="212" cy="118" r="4"><animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="160" cy="170" r="4"><animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/></circle>
      </g>
      <g fill="#7C3AED">
        <circle cx="123" cy="81" r="3"/><circle cx="197" cy="81" r="3"/>
        <circle cx="123" cy="155" r="3"/><circle cx="197" cy="155" r="3"/>
      </g>
      <text x="160" y="112" text-anchor="middle" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="24" font-weight="700">AI</text>
      <text x="160" y="134" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="3">ENGINEERING</text>
    </g>

    <text x="252" y="332" text-anchor="middle" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="29" font-weight="700">G. STEPHEN</text>
    <text x="252" y="357" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" letter-spacing="2">AIML STUDENT</text>
    <text x="252" y="381" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">ASPIRING AI / ML ENGINEER</text>

    <rect x="74" y="408" width="356" height="92" rx="12" fill="#FFFFFF" fill-opacity=".82" stroke="#CBD5E1" stroke-opacity=".45"/>
    <text x="92" y="433" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">~/profile $</text>
    <text x="173" y="433" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">build --learn</text>
    <text x="92" y="458" fill="#10B981" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">status:</text>
    <text x="146" y="458" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">Python · SQL · AI/ML</text>
    <text x="92" y="480" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">next:</text>
    <text x="137" y="480" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">ML · DSA · projects</text>

    <!-- right panel -->
    <rect x="482" y="88" width="656" height="474" rx="18" fill="#FFFFFF" fill-opacity=".74" stroke="#CBD5E1" stroke-opacity=".65"/>
    <rect x="500" y="106" width="620" height="44" rx="10" fill="#FFFFFF" fill-opacity=".82" stroke="#CBD5E1" stroke-opacity=".35"/>
    <text x="522" y="133" fill="#7C3AED" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2">SYSTEM.INFO</text>
    <text x="1098" y="133" text-anchor="end" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">profile.sh</text>

    <text x="520" y="178" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">user@aiml-profile:~$</text>
    <text x="686" y="178" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">./profile.sh</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">
      <text x="520" y="210" fill="#22D3EE">NAME</text>
      <text x="650" y="210" fill="#0F172A">G. STEPHEN</text>
      <text x="520" y="235" fill="#22D3EE">ROLE</text>
      <text x="650" y="235" fill="#0F172A">AIML Student</text>
      <text x="520" y="260" fill="#22D3EE">FOCUS</text>
      <text x="650" y="260" fill="#0F172A">AI / ML · Python · Data</text>
      <text x="520" y="285" fill="#22D3EE">LEARNING</text>
      <text x="650" y="285" fill="#0F172A">Machine Learning · DSA · SQL</text>
    </g>

    <line x1="520" y1="306" x2="1098" y2="306" stroke="#CBD5E1" stroke-opacity=".55"/>

    <text x="520" y="334" fill="#7C3AED" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="1.5">CORE STACK</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">
      <rect x="520" y="350" width="92" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".32"/>
      <text x="566" y="370" text-anchor="middle" fill="#BAE6FD">Python</text>
      <rect x="622" y="350" width="76" height="30" rx="15" fill="#7C3AED" fill-opacity=".10" stroke="#7C3AED" stroke-opacity=".34"/>
      <text x="660" y="370" text-anchor="middle" fill="#DDD6FE">SQL</text>
      <rect x="708" y="350" width="110" height="30" rx="15" fill="#10B981" fill-opacity=".08" stroke="#10B981" stroke-opacity=".30"/>
      <text x="763" y="370" text-anchor="middle" fill="#A7F3D0">AI / ML</text>
      <rect x="828" y="350" width="92" height="30" rx="15" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".30"/>
      <text x="874" y="370" text-anchor="middle" fill="#BAE6FD">GitHub</text>
    </g>

    <line x1="520" y1="400" x2="1098" y2="400" stroke="#CBD5E1" stroke-opacity=".55"/>
    <text x="520" y="428" fill="#7C3AED" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="1.5">SELECTED PROJECTS</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      <rect x="520" y="444" width="278" height="82" rx="11" fill="#FFFFFF" fill-opacity=".64" stroke="#CBD5E1" stroke-opacity=".48"/>
      <text x="538" y="468" fill="#0F172A" font-size="12" font-weight="700">AI Resume Analyzer</text>
      <text x="538" y="489" fill="#64748B" font-size="10">Resume scoring · skill matching</text>
      <text x="538" y="507" fill="#64748B" font-size="10">suggestions · history · reports</text>

      <rect x="816" y="444" width="282" height="82" rx="11" fill="#FFFFFF" fill-opacity=".64" stroke="#CBD5E1" stroke-opacity=".48"/>
      <text x="834" y="468" fill="#0F172A" font-size="12" font-weight="700">ATM Machine Python</text>
      <text x="834" y="489" fill="#64748B" font-size="10">Tkinter · authentication</text>
      <text x="834" y="507" fill="#64748B" font-size="10">transactions · PIN · receipts</text>
    </g>

    <text x="1098" y="548" text-anchor="end" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">BUILD • LEARN • SHIP</text>

    <!-- subtle scanline -->
    <rect x="18" y="88" width="1144" height="2" fill="url(#accent)" opacity=".0">
      <animate attributeName="y" values="88;590;88" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.16;0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- border shimmer -->
    <rect x="18.5" y="18.5" width="1143" height="573" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".28">
      <animate attributeName="stroke-opacity" values=".16;.42;.16" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
